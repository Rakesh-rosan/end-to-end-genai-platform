events {}

http {
    # Edge rate limit per client IP. Coarse protection *before* auth;
    # the app enforces the finer per-user limit after the JWT is verified.
    limit_req_zone $binary_remote_addr zone=per_ip:10m rate=10r/s;

    upstream shopassist {
        # least_conn suits LLM traffic: request durations vary from 5 ms (cache hit)
        # to many seconds (generation), so round-robin would pile work unevenly.
        least_conn;
        server app1:8000 max_fails=3 fail_timeout=10s;
        server app2:8000 max_fails=3 fail_timeout=10s;
    }

    server {
        listen 80;
        client_max_body_size 64k;

        location / {
            limit_req zone=per_ip burst=20 nodelay;
            proxy_pass http://shopassist;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Request-ID $request_id;
            proxy_read_timeout 120s;   # LLM calls can be slow
            proxy_next_upstream error timeout http_502 http_503;
        }
    }
}
